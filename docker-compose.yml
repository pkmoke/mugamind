# Nama project sengaja "bemai-lokal" supaya volume lama tetap terpakai.
# Tidak ada berkas .env di repo ini. Nilai di bawah memakai default yang aman
# untuk dipakai di laptop; untuk menggantinya, set variabel yang sama di
# lingkungan shell sebelum menjalankan compose (atau pakai .env lokal, yang
# tidak ikut di-commit).
name: bemai-lokal

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8899,http://127.0.0.1:8899}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  AI_ENABLED: ${AI_ENABLED:-true}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
  AI_MODEL: ${AI_MODEL:-deepseek-flash}
  AI_MAX_TOKENS: ${AI_MAX_TOKENS:-220}
  AI_KUOTA_HARIAN: ${AI_KUOTA_HARIAN:-10}
  RETENSI_NILAI_HARI: ${RETENSI_NILAI_HARI:-180}
  RETENSI_AKTIVITAS_HARI: ${RETENSI_AKTIVITAS_HARI:-90}
  ENABLE_STUDENT_DEMO_LOGIN: ${ENABLE_STUDENT_DEMO_LOGIN:-false}
  CUSTOMER_SERVICE_URL: ${CUSTOMER_SERVICE_URL:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bemai
      POSTGRES_DB: bemai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bemai_lokal_dev}
    ports:
      - "127.0.0.1:5434:5432"   # host 5434 -> container 5432; 5433 dipakai proyek lain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bemai -d bemai"]
      interval: 5s
      retries: 20

  migrate:
    build: ./backend
    restart: "no"
    command: ["python", "manage.py", "init-db"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://bemai:${POSTGRES_PASSWORD:-bemai_lokal_dev}@db:5432/bemai

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://bemai:${POSTGRES_PASSWORD:-bemai_lokal_dev}@db:5432/bemai
      GAMBAR_MATERI_DIR: /app/data/materi
    volumes:
      - materi_data:/app/data/materi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      retries: 12

  maintenance:
    build: ./backend
    restart: unless-stopped
    command: ["python", "maintenance.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://bemai:${POSTGRES_PASSWORD:-bemai_lokal_dev}@db:5432/bemai

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8899:8899"
    volumes:
      - materi_data:/srv/materi:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8899/ || exit 1"]
      interval: 10s
      retries: 6

volumes:
  postgres_data:
  materi_data:
